[package]
name = "rr"
version = "0.1.0"
edition = "2021"
description = "Command-line client for the rainbow-retriever code search server"
license = "MIT"
authors = ["Alexander Adkins"]

[lib]
name = "rr"
path = "src/lib.rs"

[[bin]]
name = "rr"
path = "src/main.rs"

[dependencies]
ureq       = { version = "2.12", features = ["json", "gzip"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap       = { version = "4.5", features = ["derive", "env"] }
anyhow     = "1.0"
uuid       = { version = "1.10", features = ["v4"] }

[dev-dependencies]
httpmock = "0.7"
