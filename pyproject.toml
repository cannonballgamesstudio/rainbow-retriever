[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rainbow-retriever"
version = "0.1.0"
description = "Multi-signal fusion retrieval for code: lexical, trigram, dense, call-graph and git-history arms fused with weighted RRF."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alexander Adkins" }]
requires-python = ">=3.11"
dependencies = [
    "srclight>=0.15.1,<0.16",
    "bm25s>=0.3.9",
    "numpy>=1.26",
    "fastapi>=0.115",
    "pydantic>=2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
